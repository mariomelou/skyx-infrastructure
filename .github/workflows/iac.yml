name: infrastructure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Enable the separately approved production deployment job"
        required: true
        default: false
        type: boolean
      import:
        description: "Execute the separately approved ECR import change set"
        required: true
        default: false
        type: boolean
      change_set_arn:
        description: "Exact approved ECR import change set ARN"
        required: true
        default: arn:aws:cloudformation:us-east-1:129346407469:changeSet/skyx-ecr-backend-import-20260912/d6c878be-6e10-4981-9c83-3b02ef9e1f39
        type: string
      adoption_component:
        description: "Optional adoption component to synthesize during a manual run"
        required: true
        default: reference-only
        type: choice
        options:
          - reference-only
          - ecr
      ecr_repository:
        description: "ECR repository for the opt-in adoption component"
        required: true
        default: skyx-backend
        type: choice
        options:
          - skyx-backend
          - skyx-frontend
      hardening_component:
        description: "Optional hardening component to synthesize during a manual run"
        required: true
        default: none
        type: choice
        options:
          - none
          - observability
          - ecs-scaling
          - waf
      alarm_topic_arn:
        description: "Approved same-account SNS topic ARN for observability alarms"
        required: false
        default: ""
        type: string
      elb5xx_threshold:
        description: "Approved five-minute ALB 5XX threshold"
        required: false
        default: ""
        type: string
      rds_connections_threshold:
        description: "Approved Aurora DatabaseConnections threshold"
        required: false
        default: ""
        type: string
      api_min_capacity:
        description: "Approved API ECS minimum capacity"
        required: false
        default: ""
        type: string
      api_max_capacity:
        description: "Approved API ECS maximum capacity"
        required: false
        default: ""
        type: string
      api_target_cpu:
        description: "Approved API ECS target CPU percentage"
        required: false
        default: ""
        type: string
      frontend_min_capacity:
        description: "Approved frontend ECS minimum capacity"
        required: false
        default: ""
        type: string
      frontend_max_capacity:
        description: "Approved frontend ECS maximum capacity"
        required: false
        default: ""
        type: string
      frontend_target_cpu:
        description: "Approved frontend ECS target CPU percentage"
        required: false
        default: ""
        type: string
      waf_mode:
        description: "WAF mode; the first component is observation-only"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  validate:
    name: synth and diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run build
      - name: Synthesize
        run: npm run synth
      - name: Synthesize selected ECR adoption component
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.adoption_component == 'ecr' }}
        run: npx cdk synth SkyxEcrAdoption -c adoptionComponent=ecr -c ecrRepository=${{ inputs.ecr_repository }}
      - name: Synthesize selected observability component
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.hardening_component == 'observability' }}
        env:
          ALARM_TOPIC_ARN: ${{ inputs.alarm_topic_arn }}
          ELB5XX_THRESHOLD: ${{ inputs.elb5xx_threshold }}
          RDS_CONNECTIONS_THRESHOLD: ${{ inputs.rds_connections_threshold }}
        run: |
          test -n "$ALARM_TOPIC_ARN" || { echo "::error::An approved alarm topic ARN is required for observability synthesis."; exit 1; }
          test -n "$ELB5XX_THRESHOLD" || { echo "::error::An approved ALB 5XX threshold is required for observability synthesis."; exit 1; }
          test -n "$RDS_CONNECTIONS_THRESHOLD" || { echo "::error::An approved Aurora connection threshold is required for observability synthesis."; exit 1; }
          npx cdk synth SkyxObservability -c hardeningComponent=observability -c alarmTopicArn="$ALARM_TOPIC_ARN" -c elb5xxThreshold="$ELB5XX_THRESHOLD" -c rdsConnectionsThreshold="$RDS_CONNECTIONS_THRESHOLD"
          node scripts/verify-observability.mjs
      - name: Synthesize selected ECS scaling component
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.hardening_component == 'ecs-scaling' }}
        env:
          API_MIN_CAPACITY: ${{ inputs.api_min_capacity }}
          API_MAX_CAPACITY: ${{ inputs.api_max_capacity }}
          API_TARGET_CPU: ${{ inputs.api_target_cpu }}
          FRONTEND_MIN_CAPACITY: ${{ inputs.frontend_min_capacity }}
          FRONTEND_MAX_CAPACITY: ${{ inputs.frontend_max_capacity }}
          FRONTEND_TARGET_CPU: ${{ inputs.frontend_target_cpu }}
        run: |
          test -n "$API_MIN_CAPACITY" || { echo "::error::An approved API minimum capacity is required for ECS scaling synthesis."; exit 1; }
          test -n "$API_MAX_CAPACITY" || { echo "::error::An approved API maximum capacity is required for ECS scaling synthesis."; exit 1; }
          test -n "$API_TARGET_CPU" || { echo "::error::An approved API CPU target is required for ECS scaling synthesis."; exit 1; }
          test -n "$FRONTEND_MIN_CAPACITY" || { echo "::error::An approved frontend minimum capacity is required for ECS scaling synthesis."; exit 1; }
          test -n "$FRONTEND_MAX_CAPACITY" || { echo "::error::An approved frontend maximum capacity is required for ECS scaling synthesis."; exit 1; }
          test -n "$FRONTEND_TARGET_CPU" || { echo "::error::An approved frontend CPU target is required for ECS scaling synthesis."; exit 1; }
          npx cdk synth SkyxEcsScaling -c hardeningComponent=ecs-scaling -c apiMinCapacity="$API_MIN_CAPACITY" -c apiMaxCapacity="$API_MAX_CAPACITY" -c apiTargetCpu="$API_TARGET_CPU" -c frontendMinCapacity="$FRONTEND_MIN_CAPACITY" -c frontendMaxCapacity="$FRONTEND_MAX_CAPACITY" -c frontendTargetCpu="$FRONTEND_TARGET_CPU"
          node scripts/verify-ecs-scaling.mjs
      - name: Synthesize selected WAF component
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.hardening_component == 'waf' }}
        env:
          WAF_MODE: ${{ inputs.waf_mode }}
        run: |
          test "$WAF_MODE" = "count" || { echo "::error::The first WAF component requires waf_mode=count."; exit 1; }
          npx cdk synth SkyxWaf -c hardeningComponent=waf -c wafMode="$WAF_MODE"
          node scripts/verify-waf.mjs
      - name: Reject unimplemented ECR deployment path
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true && inputs.adoption_component == 'ecr' }}
        run: |
          echo "::error::ECR adoption execution remains change-set approval-gated and is not wired to the generic deploy job."
          exit 1
      - name: Reject combined opt-in components
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.adoption_component == 'ecr' && inputs.hardening_component != 'none' }}
        run: |
          echo "::error::Select one opt-in component per run; adoption and hardening must be reviewed separately."
          exit 1
      - name: Reject unimplemented hardening deployment path
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true && inputs.hardening_component != 'none' }}
        run: |
          echo "::error::Hardening components remain design-and-change-set approval-gated and are not wired to the generic deploy job."
          exit 1
      - name: Reject conflicting production operations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true && inputs.import == true }}
        run: |
          echo "::error::Choose either deploy or import, never both in one manual run."
          exit 1
      - name: Require guarded ECR import selection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.import == true }}
        env:
          IMPORT_ENABLED: ${{ vars.AWS_IAC_IMPORT_ENABLED }}
          ADOPTION_COMPONENT: ${{ inputs.adoption_component }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          CHANGE_SET_ARN: ${{ inputs.change_set_arn }}
          HARDENING_COMPONENT: ${{ inputs.hardening_component }}
        run: |
          test "$HARDENING_COMPONENT" = "none" || { echo "::error::Do not combine ECR import with a hardening component."; exit 1; }
          test "$IMPORT_ENABLED" = "true" || { echo "::error::A repository administrator must enable AWS_IAC_IMPORT_ENABLED before any import job can run."; exit 1; }
          test "$ADOPTION_COMPONENT" = "ecr" || { echo "::error::Imports are limited to the ECR component."; exit 1; }
          test "$ECR_REPOSITORY" = "skyx-backend" || { echo "::error::The first approved import is limited to skyx-backend."; exit 1; }
          test "$CHANGE_SET_ARN" = "arn:aws:cloudformation:us-east-1:129346407469:changeSet/skyx-ecr-backend-import-20260912/d6c878be-6e10-4981-9c83-3b02ef9e1f39" || { echo "::error::The change set ARN is not the reviewed approval-packet ARN."; exit 1; }
      - name: Require read-only preview role
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          PREVIEW_ROLE_ARN: ${{ vars.AWS_IAC_PREVIEW_ROLE_ARN }}
        run: |
          if [ -z "$PREVIEW_ROLE_ARN" ]; then
            echo "::error::Configure the repository variable AWS_IAC_PREVIEW_ROLE_ARN before running the authenticated IaC diff."
            exit 1
          fi
      - name: Configure read-only preview credentials
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_IAC_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify preview account
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "129346407469"
      - name: Explain fork preview limitation
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "Skipping AWS diff for a fork pull request; synthesis remains available without AWS credentials."
      - name: Diff
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: npm run diff -- --method template
      - name: Diff selected ECR adoption component
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.adoption_component == 'ecr' }}
        run: npx cdk diff SkyxEcrAdoption -c adoptionComponent=ecr -c ecrRepository=${{ inputs.ecr_repository }} --method template
      - name: Diff selected observability component
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.hardening_component == 'observability' }}
        env:
          ALARM_TOPIC_ARN: ${{ inputs.alarm_topic_arn }}
          ELB5XX_THRESHOLD: ${{ inputs.elb5xx_threshold }}
          RDS_CONNECTIONS_THRESHOLD: ${{ inputs.rds_connections_threshold }}
        run: npx cdk diff SkyxObservability -c hardeningComponent=observability -c alarmTopicArn="$ALARM_TOPIC_ARN" -c elb5xxThreshold="$ELB5XX_THRESHOLD" -c rdsConnectionsThreshold="$RDS_CONNECTIONS_THRESHOLD" --method template
      - name: Diff selected ECS scaling component
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.hardening_component == 'ecs-scaling' }}
        env:
          API_MIN_CAPACITY: ${{ inputs.api_min_capacity }}
          API_MAX_CAPACITY: ${{ inputs.api_max_capacity }}
          API_TARGET_CPU: ${{ inputs.api_target_cpu }}
          FRONTEND_MIN_CAPACITY: ${{ inputs.frontend_min_capacity }}
          FRONTEND_MAX_CAPACITY: ${{ inputs.frontend_max_capacity }}
          FRONTEND_TARGET_CPU: ${{ inputs.frontend_target_cpu }}
        run: npx cdk diff SkyxEcsScaling -c hardeningComponent=ecs-scaling -c apiMinCapacity="$API_MIN_CAPACITY" -c apiMaxCapacity="$API_MAX_CAPACITY" -c apiTargetCpu="$API_TARGET_CPU" -c frontendMinCapacity="$FRONTEND_MIN_CAPACITY" -c frontendMaxCapacity="$FRONTEND_MAX_CAPACITY" -c frontendTargetCpu="$FRONTEND_TARGET_CPU" --method template
      - name: Diff selected WAF component
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.hardening_component == 'waf' }}
        env:
          WAF_MODE: ${{ inputs.waf_mode }}
        run: npx cdk diff SkyxWaf -c hardeningComponent=waf -c wafMode="$WAF_MODE" --method template

  import:
    name: execute approved ECR import
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.import == true && inputs.adoption_component == 'ecr' && inputs.ecr_repository == 'skyx-backend' && vars.AWS_IAC_IMPORT_ENABLED == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Require deployment role
        env:
          DEPLOY_ROLE_ARN: ${{ secrets.AWS_IAC_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$DEPLOY_ROLE_ARN" || { echo "::error::Configure AWS_IAC_DEPLOY_ROLE_ARN in the protected production environment."; exit 1; }
      - name: Configure deployment credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify deployment account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "129346407469"
      - name: Revalidate exact approved change set
        env:
          CHANGE_SET_ARN: ${{ inputs.change_set_arn }}
        run: |
          test "$CHANGE_SET_ARN" = "arn:aws:cloudformation:us-east-1:129346407469:changeSet/skyx-ecr-backend-import-20260912/d6c878be-6e10-4981-9c83-3b02ef9e1f39"
          test "$(aws cloudformation describe-change-set --change-set-name "$CHANGE_SET_ARN" --query Status --output text)" = "CREATE_COMPLETE"
          test "$(aws cloudformation describe-change-set --change-set-name "$CHANGE_SET_ARN" --query 'length(Changes)' --output text)" = "1"
          test "$(aws cloudformation describe-change-set --change-set-name "$CHANGE_SET_ARN" --query 'Changes[0].ResourceChange.Action' --output text)" = "Import"
          test "$(aws cloudformation describe-change-set --change-set-name "$CHANGE_SET_ARN" --query 'Changes[0].ResourceChange.ResourceType' --output text)" = "AWS::ECR::Repository"
          test "$(aws cloudformation describe-change-set --change-set-name "$CHANGE_SET_ARN" --query 'Changes[0].ResourceChange.PhysicalResourceId' --output text)" = "skyx-backend"
      - name: Execute approved import change set
        env:
          CHANGE_SET_ARN: ${{ inputs.change_set_arn }}
        run: aws cloudformation execute-change-set --change-set-name "$CHANGE_SET_ARN"
      - name: Wait for import completion
        run: aws cloudformation wait stack-import-complete --stack-name SkyxEcrAdoption
      - name: Verify imported resource and post-import diff
        run: |
          test "$(aws cloudformation describe-stack-resources --stack-name SkyxEcrAdoption --query 'StackResources[?LogicalResourceId==`Repository`].PhysicalResourceId' --output text)" = "arn:aws:ecr:us-east-1:129346407469:repository/skyx-backend"
          npm run verify:ecr
          npx cdk diff SkyxEcrAdoption -c adoptionComponent=ecr -c ecrRepository=skyx-backend --method template

  deploy:
    name: approved production deployment
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true && inputs.adoption_component == 'reference-only' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Require deployment role
        env:
          DEPLOY_ROLE_ARN: ${{ secrets.AWS_IAC_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$DEPLOY_ROLE_ARN" ]; then
            echo "::error::Configure the production secret AWS_IAC_DEPLOY_ROLE_ARN before running deployment."
            exit 1
          fi
      - name: Configure deployment credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify deployment account
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "129346407469"
      - name: Deploy with approval gate
        run: npx cdk deploy --require-approval broad
